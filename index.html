<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LEGO SPIKE Family Arcade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%B1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/index.css">
</head>
<body>
<div class="page-shell">

  <header class="home-header">
    <div id="mascot-slot"></div>
    <div>
      <h1 class="title-hero">LEGO SPIKE 大冒险</h1>
      <p class="text-muted" style="margin:0;">拖积木、闯关卡，集星星拿徽章！</p>
    </div>
  </header>

  <section class="brick-card brick-card--yellow home-progress">
    <div class="flex-between">
      <span class="title-sm">总进度</span>
      <span class="title-sm" id="progress-label">0 / 54 ★</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </section>

  <section class="home-category-block">
    <h2 class="title-lg category-heading category-heading--screen">🖥️ 屏幕编程</h2>
    <div class="home-levels-grid" id="levels-grid"></div>
  </section>

  <section class="home-category-block home-family-block">
    <h2 class="title-lg category-heading category-heading--family">🎉 一起玩（全家真人游戏）</h2>
    <p class="text-muted home-family-tagline">放下屏幕，全家一起动起来！iPad 当主持人，出题目、打节拍、翻答案。</p>
    <div class="home-family-grid" id="family-grid"></div>
  </section>

  <section class="home-flashcard-entry" style="display:flex; gap:12px; flex-wrap:wrap;">
    <a href="flashcards.html" class="brick-card brick-card--purple brick-card--interactive tap-target flashcard-entry-card" style="flex:1 1 220px;">
      <span class="fc-icon">🗂️</span>
      <span>
        <span class="title-md" style="display:block;">闪卡 &amp; 小测验</span>
        <span class="text-muted" style="font-size: var(--font-small);">复习积木知识，挑战满分拿"闪卡大师"徽章</span>
      </span>
    </a>
    <a href="assets/pdf/Lego_Spike_Prime_Flashcards_And_Games.pdf" target="_blank" rel="noopener" class="brick-card brick-card--orange brick-card--interactive tap-target flashcard-entry-card" style="flex:1 1 220px;">
      <span class="fc-icon">🖨️</span>
      <span>
        <span class="title-md" style="display:block;">纸质教具 PDF</span>
        <span class="text-muted" style="font-size: var(--font-small);">打印闪卡+游戏手册，新窗口打开</span>
      </span>
    </a>
  </section>

  <section class="home-badges">
    <h2 class="title-lg">徽章墙</h2>
    <div class="badges-row" id="badges-row"></div>
  </section>

  <footer class="home-footer">
    <a href="parents.html" class="parents-link">家长角落</a>
  </footer>

</div>

<script type="module">
import { createMascot } from './js/mascot.js';
import { store, GAME_IDS } from './js/store.js';

const LEVELS = [
  { id: 'hunt',   title: '网格寻宝', icon: '🗺️', cat: 'hunt' },
  { id: 'claw',   title: '抓娃娃机', icon: '🕹️', cat: 'claw' },
  { id: 'macro',  title: '口诀大师', icon: '📜', cat: 'macro' },
  { id: 'race',   title: '机关轨道', icon: '🏁', cat: 'race' },
  { id: 'sort',   title: '流水线密码', icon: '📦', cat: 'sort' },
  { id: 'bridge', title: '精准渡桥', icon: '🌉', cat: 'bridge' },
];

const BADGES = [
  ...LEVELS.map((l) => ({ id: l.id, icon: l.icon, label: l.title, cat: l.cat })),
  { id: 'quiz', icon: '🗂️', label: '闪卡大师', cat: 'macro' },
];

// 「一起玩」真人互动游戏——不计星/无 level，家庭真人打卡走独立的 localStorage
// key（js/family-shell.js 里的 lsfa_family_v1），这里只负责渲染入口卡片。
const FAMILY_GAMES = [
  { id: 'humanrobot', title: '人体机器人', icon: '🤖', sub: '你说我做，精确指令传达' },
  { id: 'livinghunt', title: '客厅寻宝', icon: '🧭', sub: '真人版寻宝，工作记忆预演' },
  { id: 'rhythm', title: '节奏程序', icon: '🥁', sub: '跟拍循环，越跑越快' },
  { id: 'macrospell', title: '口令宏', icon: '🔮', sub: '定义宏、混合播报' },
  { id: 'ifthen', title: '如果就', icon: '🚦', sub: '条件反射，抑制控制' },
  { id: 'humanbelt', title: '人体传送带', icon: '🎒', sub: '循环计数，心算记忆' },
];

function miniStarsMarkup(n) {
  let s = '<div class="star-rating star-rating--mini">';
  for (let i = 1; i <= 3; i++) {
    s += `<span class="star${i <= n ? ' star--filled' : ''}">★</span>`;
  }
  return s + '</div>';
}

// 已通 L1 解锁 L2、已通 L2 解锁 L3；点卡片直接跳去玩家当前能玩的最高难度。
function highestUnlockedLevel(lv) {
  let highest = 1;
  if (lv.l1 >= 1) highest = 2;
  if (lv.l2 >= 1) highest = 3;
  return highest;
}

function renderLevels() {
  const grid = document.getElementById('levels-grid');
  const allStars = store.getAllStars();
  grid.innerHTML = LEVELS.map((lvl) => {
    const lv = allStars[lvl.id] || { l1: 0, l2: 0, l3: 0 };
    const target = highestUnlockedLevel(lv);
    return `
      <a href="game.html?g=${lvl.id}&l=${target}" class="brick-card brick-card--interactive brick-card--cat-${lvl.cat} level-card tap-target" data-level="${lvl.id}">
        <div class="level-card-icon">${lvl.icon}</div>
        <div class="title-md">${lvl.title}</div>
        <div class="level-progress">
          <div class="level-progress-row"><span class="level-progress-tag">L1</span>${miniStarsMarkup(lv.l1)}</div>
          <div class="level-progress-row"><span class="level-progress-tag">L2</span>${miniStarsMarkup(lv.l2)}</div>
          <div class="level-progress-row"><span class="level-progress-tag">L3</span>${miniStarsMarkup(lv.l3)}</div>
        </div>
      </a>
    `;
  }).join('');
}

function renderFamilyGrid() {
  const grid = document.getElementById('family-grid');
  grid.innerHTML = FAMILY_GAMES.map((g) => `
    <a href="family.html?f=${g.id}" class="brick-card brick-card--orange brick-card--interactive family-card tap-target" data-family="${g.id}">
      <div class="level-card-icon">${g.icon}</div>
      <div class="title-md">${g.title}</div>
      <div class="text-muted family-card-sub-label">${g.sub}</div>
    </a>
  `).join('');
}

function renderBadges() {
  const row = document.getElementById('badges-row');
  const unlocked = store.getBadges();
  row.innerHTML = BADGES.map((b) => {
    const isUnlocked = unlocked.includes(b.id);
    const tier = store.getBadgeTier(b.id);
    const cls = ['badge-hex'];
    if (!isUnlocked) cls.push('badge-hex--locked');
    if (tier === 'gold') cls.push('badge-hex--gold');
    return `
      <div class="badge-item">
        <div class="${cls.join(' ')}" style="--badge-color: var(--cat-${b.cat});">
          ${isUnlocked ? (tier === 'gold' ? '🌟' : b.icon) : '❔'}
        </div>
        <div class="badge-item-label">${b.label}</div>
      </div>
    `;
  }).join('');
}

function renderProgress() {
  const total = store.totalStars();
  const max = store.maxStars();
  document.getElementById('progress-label').textContent = `${total} / ${max} ★`;
  document.getElementById('progress-fill').style.width = `${max ? (total / max) * 100 : 0}%`;
}

function greetingLine(total, max) {
  if (total === 0) return '你好！我是 Spike，一起来闯关拿星星吧！';
  if (total >= max) return '全部满星！你是真正的编程大师！';
  return `欢迎回来！你已经拿到 ${total} 颗星啦，继续加油！`;
}

renderLevels();
renderFamilyGrid();
renderBadges();
renderProgress();

const mascot = createMascot(document.getElementById('mascot-slot'), { emotion: 'happy' });
// 延迟 1 秒再打招呼：让标题/副标题先露出来，也给气泡弹出一个更自然的欢迎节奏
// （气泡本身的遮挡问题已经在 css/index.css 里通过 .home-header 改 flex-start 解掉，
// 这里的延迟纯粹是体验上的锦上添花，不是覆盖问题的主要修复手段）。
setTimeout(() => {
  mascot.say(greetingLine(store.totalStars(), store.maxStars()), 'happy', 0);
}, 900);
</script>
</body>
</html>
