<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061426">
  <title>SPIKE Prime · 打印任务包</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23061426'/%3E%3Cpath d='M25 18h50v64H25z' fill='%23fff'/%3E%3Cpath d='M34 34h32M34 48h32M34 62h22' stroke='%232771dc' stroke-width='7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/print-kit.css">
</head>
<body>
  <div class="print-kit-app">
    <header class="print-kit-header">
      <a class="print-kit-back" href="index.html" aria-label="返回任务地图">← 返回任务地图</a>
      <div>
        <span>OFFLINE FIELD KIT</span>
        <h1>26 页打印任务包</h1>
      </div>
      <strong>PDF · A4</strong>
    </header>

    <main class="print-kit-main">
      <section class="print-kit-actions" aria-labelledby="print-kit-actions-title">
        <div class="print-kit-copy">
          <span>IPAD / HOME SCREEN SAFE</span>
          <h2 id="print-kit-actions-title">26 页已经全部渲染在这里</h2>
          <p>直接向下浏览，不会进入或覆盖成浏览器的 PDF 查看器。需要纸质版时，只按右侧的打印按钮。</p>
        </div>
        <button class="print-kit-button print-kit-button--primary" id="print-pages" type="button">打印全部 26 页</button>
        <p class="print-kit-status" id="print-kit-status" role="status" aria-live="polite">正在载入 26 页任务包…</p>
      </section>

      <section class="print-page-stack" id="pdf-pages" aria-label="26 页打印任务包"></section>
    </main>
  </div>
  <script type="module" src="js/print-kit.js"></script>
</body>
</html>
