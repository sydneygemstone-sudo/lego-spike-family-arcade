<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sfx 冒烟测试（QA only，不在产品导航中）</title>
<link rel="stylesheet" href="css/design-system.css">
</head>
<body>
<div class="page-shell">
  <h1 class="title-xl">sfx.js 冒烟测试</h1>
  <p class="text-muted">点击任意按钮播放对应音效；打开浏览器 console 确认无报错。此页仅供自查，不在产品首页导航中出现。</p>
  <div class="flex-row gap-3 flex-wrap" id="btns"></div>
  <p id="log" class="text-muted" style="margin-top:16px; white-space:pre-wrap;"></p>
</div>
<script type="module">
import { sfx } from './js/sfx.js';

const log = document.getElementById('log');
function say(msg) { log.textContent += msg + '\n'; console.log(msg); }

const sounds = ['click', 'snap', 'success', 'fail', 'star'];
const btnsEl = document.getElementById('btns');
sounds.forEach((name) => {
  const b = document.createElement('button');
  b.className = 'brick-btn brick-btn--blue';
  b.textContent = name;
  b.addEventListener('click', () => {
    try {
      sfx[name]();
      say(`OK: sfx.${name}() played without throwing`);
    } catch (e) {
      say(`ERROR in sfx.${name}(): ${e.message}`);
    }
  });
  btnsEl.appendChild(b);
});

window.addEventListener('error', (e) => say(`window error: ${e.message}`));
say('页面加载完成，AudioContext 将在第一次点击后解锁。');
</script>
</body>
</html>
