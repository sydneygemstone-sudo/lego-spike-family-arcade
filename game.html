<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- 完整 URL 形如 game.html?g=<id>&l=<1..10>&seed=<run>&v=<1..10> —— g 选游戏、l 选任务、v 选可复现组合（缺省/非法值回退 1），
     解析逻辑都在 js/shell.js 里，这个文件本身不需要关心 -->
<title>机器人任务控制台 · Programming Lab</title>
<meta name="theme-color" content="#061426">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23061426'/%3E%3Cpath d='M22 50 40 32h38v36H40z' fill='%2358e1ec'/%3E%3Ccircle cx='49' cy='50' r='5' fill='%23061426'/%3E%3Ccircle cx='67' cy='50' r='5' fill='%23061426'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/art-direction.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app"></div>
<script>
  // QA/自动化专用：URL 带 ?test=1 时打开 window.__LSFA_TEST__，关卡模块按需暴露只读测试钩子
  // （目前 games/hunt.js、games/macro.js 用到，见各自文件内注释）。生产环境正常入口不会带
  // 这个参数，不影响玩家体验。
  if (new URLSearchParams(location.search).get('test') === '1') {
    window.__LSFA_TEST__ = true;
  }
</script>
<script type="module" src="js/shell.js"></script>
</body>
</html>
